# 每週一提依賴更新 PR：Cargo 依賴與 workflow 裡釘死 commit 的 actions（釘 commit 之後升級全靠這裡）。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # windows-rs 一家（windows / windows-core / windows-registry / windows-reactor / windows-strings…）版本必須一起走：
      # windows-core 0.100 配 windows 0.62 的 #[implement] 直接編不過（Box 私有），windows-registry 0.100 的 Error 與 0.62 的對不上；
      # 合成一個 PR，只有全家都有新版時才可能綠
      windows-rs:
        patterns: ["windows", "windows-*"]
    ignore:
      # windows 主包還停在 0.62.2，姊妹包先到了 0.100：單獨跟著姊妹包升編不過（見上）。先壓住它們的 0.x 版本跳（Dependabot 算 minor），
      # 等 windows 出 0.100 時會單獨來一個 PR，那時把這段刪掉、手動一家一起升
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "windows-registry"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
