# 三個 job：Linux 跑 fmt / clippy / 全 workspace 測試（排除 IMK 外殼）；macOS 與 Windows runner 各編各的殼並跑平臺測試，
# 平臺特有的編譯錯（Objective-C 呼叫、TSF 匯出、WinUI）在 PR 裡就暴露，不等發版。倉庫公開，Actions 不計費。
# actions 一律釘到 commit（註釋裡是對應的標籤），Dependabot 每週提 PR 更新；cargo 全加 --locked，Cargo.lock 沒提交就報錯。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Fcitx5 build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev nlohmann-json3-dev fcitx5

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude qingjian-macos --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude qingjian-macos --locked

      - name: Build Linux server
        run: cargo build -p qingjian-linux-server --locked

      - name: Configure Fcitx5 default panel
        run: cmake -S apps/linux/fcitx5 -B target/fcitx5-stage1 -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build Fcitx5 default panel
        run: cmake --build target/fcitx5-stage1 --parallel 2

      # 日誌用 tee 落盤，失敗時由下面的 Upload Linux diagnostics 打包上傳，便於排障。
      # 必須顯式 shell: bash：預設的 bash -e 不帶 pipefail，`| tee` 會返回 tee 的退出碼、把測試失敗吞掉，
      # if: failure() 的診斷上傳也不會觸發
      - name: Test Fcitx5 default panel
        shell: bash
        run: |
          mkdir -p target/ci-logs
          env -u DBUS_SESSION_BUS_ADDRESS ctest --test-dir target/fcitx5-stage1 --output-on-failure 2>&1 | tee target/ci-logs/fcitx5-ctest.log

      - name: Validate Linux install scripts
        run: bash -n apps/linux/scripts/install.sh apps/linux/scripts/uninstall.sh apps/linux/scripts/package.sh apps/linux/scripts/package-install.sh

      - name: Test Linux installation
        shell: bash
        run: |
          mkdir -p target/ci-logs
          python3 apps/linux/tests/installation.py 2>&1 | tee target/ci-logs/linux-installation.log

      - name: Upload Linux diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-ci-diagnostics
          if-no-files-found: ignore
          path: |
            target/ci-logs/**
            target/fcitx5-stage1/Testing/**
            target/fcitx5-stage1/CMakeFiles/CMakeOutput.log
            target/fcitx5-stage1/CMakeFiles/CMakeError.log

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (IMK shell)
        run: cargo clippy -p qingjian-macos --all-targets --locked -- -D warnings

      - name: Test (IMK shell)
        run: cargo test -p qingjian-macos --locked

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Server 的 build.rs 嵌 uiAccess manifest，沒簽名的 exe（含測試二進位制）起不來（os error 740）；與 release.yml 一樣關掉
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          components: clippy
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (Server, TSF DLL, Settings)
        run: cargo clippy -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --all-targets --locked -- -D warnings

      - name: Test (Server, TSF DLL, Settings)
        run: cargo test -p qingjian-windows-server -p qingjian-windows-tsf -p qingjian-windows-settings --locked

      # 安裝包另帶一份 32 位 DLL（企業微信 / WPS 這類 32 位應用只能載入它）
      - name: Check (TSF DLL, 32-bit)
        run: cargo check -p qingjian-windows-tsf --target i686-pc-windows-msvc --locked
