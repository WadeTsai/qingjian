name: 報告問題
description: 功能不正常、崩潰、行為與文件不符
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        標題請用一句話寫清現象，例如「Windows 記事本里敲 v 進不了表示式模式」。

        感謝反饋。請儘量填全，尤其是復現步驟和版本號，能省去來回追問的時間。
        提交後維護者會補上平臺（`os: *`）與模組（`area: *`）標籤，不必自己操心。
  - type: checkboxes
    id: checked
    attributes:
      label: 提交前確認
      options:
        - label: 已搜尋過現有 issue（包括已關閉的），沒有重複
          required: true
        - label: 已查過[使用說明](https://qingjian.app/docs)，裡面沒有答案
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平臺
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: 系統版本
      description: 例如 macOS 26.1、Windows 11 24H2、Windows 10 22H2
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: qingjian_version
    attributes:
      label: 青簡版本
      description: 「設定 → 關於」頁裡的版本號，或下載的安裝包檔名
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: 出問題時所在的應用
      description: 如果只在某些應用裡出現，寫出應用名和版本；所有應用都出現就寫「全部」
      placeholder: 企業微信 4.1.x / Visual Studio Code / 全部
  - type: dropdown
    id: schema
    attributes:
      label: 輸入方案
      options:
        - 全拼
        - 雙拼
        - 不確定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 復現步驟
      description: 一步一步寫，包括敲了哪些鍵。能穩定復現請註明；偶發的也請寫大致頻率。
      placeholder: |
        1. 切到青簡，在記事本里輸入 v1+2
        2. 預期出現 3，實際……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際行為
      description: 可以貼截圖或錄屏。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 執行日誌
      description: |
        先貼「設定 → 關於 → 複製診斷資訊」的內容（版本、系統、配置，金鑰會被抹去）。
        日誌檔案：macOS 在「關於 → 開啟日誌目錄」裡取當天的；Windows 點「關於 → 打包日誌到桌面」，把 zip 拖進來作為附件。
        目錄位置見 https://qingjian.app/docs/help/data-and-logs 。預設級別不含輸入內容。
      render: text
