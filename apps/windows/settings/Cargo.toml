[package]
name = "qingjian-windows-settings"
description = "Windows 輸入法的設定介面：左側導航欄 + 各分節表單，讀寫 %APPDATA%\\Qingjian\\config.toml，對齊 macOS 偏好設定"
version = "0.2.1-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-settings"
path = "src/main.rs"

[dependencies]
qingjian-platform.workspace = true
qingjian-predict.workspace = true
toml_edit.workspace = true

# UI 本體只在 Windows 編
[target."cfg(windows)".dependencies]
windows-reactor = "0.100"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# 只用它的 system_fonts（DirectWrite 列字族）
qingjian-render.workspace = true
qingjian-learning.workspace = true
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-translate.workspace = true
qingjian-update.workspace = true
jiff.workspace = true
rfd = "0.17"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
# 自包含部署 Windows App Runtime（Windows 10 上框架依賴的引導用不了，見 build.rs 與 docs\notes\windows-win10.md）
windows-reactor-setup = "0.100"

[lints]
workspace = true
