[workspace]
resolver = "3"
members = [
    "crates/qingjian-core",
    "crates/qingjian-dictionary",
    "crates/qingjian-translate",
    "crates/qingjian-learning",
    "crates/qingjian-platform",
    "crates/qingjian-predict",
    "crates/qingjian-lm",
    "crates/qingjian-format",
    "crates/qingjian-neural",
    "crates/qingjian-render",
    "crates/qingjian-update",
    "apps/linux/server", "apps/cli", "apps/macos", "apps/windows/server", "apps/windows/tsf", "apps/windows/settings", "tools/dict-convert", "tools/gloss-gen", "tools/release-sign",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/qingjian-team/qingjian"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# 內部 crate
qingjian-core = { path = "crates/qingjian-core" }
qingjian-dictionary = { path = "crates/qingjian-dictionary" }
qingjian-translate = { path = "crates/qingjian-translate" }
qingjian-learning = { path = "crates/qingjian-learning" }
qingjian-platform = { path = "crates/qingjian-platform" }
qingjian-predict = { path = "crates/qingjian-predict" }
qingjian-lm = { path = "crates/qingjian-lm" }
qingjian-format = { path = "crates/qingjian-format" }
qingjian-neural = { path = "crates/qingjian-neural" }
qingjian-render = { path = "crates/qingjian-render" }
qingjian-update = { path = "crates/qingjian-update" }

# 外部依賴統一在這裡定版本，子 crate 一律 `xxx.workspace = true`
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dotenvy = "0.15.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde_json = "1.0.151"
toml = "1.1.5"
toml_edit = "0.25"
# 快捷候選的日期 / 時間（本地時區）
jiff = "0.2.35"
plist = "1.7"
# 熱路徑上的字串鍵雜湊表（詞頻 / 語言模型 / 個人 n-gram）：SipHash 一次查表幾十納秒，單字母簡拼一鍵要查幾萬次
foldhash = "0.2.0"
# 繁體輸出（OpenCC s2tw，內建詞表）；只要簡→繁那半
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["s2t-conversion"] }
# .qj 資料容器：mmap 開啟、結構體陣列零複製讀取
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }

# 本地神經語言模型推理（字級 Transformer，權重 safetensors）
candle-core = "0.11.0"
candle-nn = "0.11.0"

# 雲聯想：OpenAI 相容介面客戶端與它需要的非同步執行時
async-openai = { version = "0.42.0", default-features = false, features = ["chat-completion", "native-tls", "byot"] }
reqwest = { version = "0.13", default-features = false }
uuid = { version = "1.26", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt", "time"] }

# 檢查更新：releases.json 的 ed25519 簽名（發版時 tools/release-sign 籤，客戶端驗）
ed25519-dalek = "3.0.0"
base64 = "0.23.1"

# 自繪渲染器：CPU 柵格 + 文字整形/回退/柵格（fontdb / rustybuzz / swash）
tiny-skia = "0.12.0"
# 不開 fontconfig：不掃系統字型庫，字型檔案由渲染器按平臺清單自己載入
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
png = "0.18.1"
# 字形輪廓的路徑命令（cosmic-text 取輪廓返回它，文字描邊用）；與 swash 用的同一版本
zeno = { version = "0.3.3", default-features = false }
# 渲染器場景圖的佈局：只要 flexbox 與 grid，不要 block / float
taffy = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }

# macOS 平臺層
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSGeometry", "NSObject", "NSProcessInfo", "NSRange", "NSString", "NSTimer", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSAttributedString", "NSEvent", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSPanel", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPasteboard", "NSSavePanel", "NSCell", "NSFontManager", "NSPopUpButton", "NSPopover", "NSSearchField", "NSSearchFieldCell", "NSViewController", "NSTextField", "NSSecureTextField", "NSTextFieldCell", "NSActionCell", "NSRunningApplication", "NSAppearance", "NSText", "NSButton", "NSButtonCell", "NSControl", "NSStringDrawing", "NSTabView", "NSTabViewItem", "NSView", "NSWindow", "NSScrollView", "NSClipView", "NSTextView", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSTableHeaderCell", "NSParagraphStyle", "NSWorkspace", "NSAccessibility", "block2"] }
objc2-input-method-kit = "0.3.2"
# 候選窗字型設定：按字族名找字型檔案（渲染器只加載指定檔案）
objc2-core-text = { version = "0.3.2", features = ["CTFont", "CTFontDescriptor"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFBase", "CFDictionary", "CFNumber", "CFSet", "CFString", "CFURL"] }

# Windows 平臺層
embed-manifest = "1.4.0"
windows-registry = "0.6.1"

# cosmic-text 加了 opsz 光學字號支援（FontSystem::set_optical_size），補丁在 qingjian-team 的 fork，分支 qingjian-opsz 基於 0.19.0；
# 上游收了就刪掉這段回 crates.io。見 docs/design/rendering.md
[patch.crates-io]
cosmic-text = { git = "https://github.com/qingjian-team/cosmic-text", rev = "9cf0d65a5e4db381e34907103326673386096be3" }
