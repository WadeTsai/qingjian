[package]
name = "qingjian-neural"
description = "字級 Transformer 語言模型的本地推理：載入 tools/lm-train 匯出的權重，給整句路徑重打分"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Apple Accelerate 的 BLAS（CPU 矩陣乘走 AMX）；預設是 candle 自帶的 gemm
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# Apple GPU
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
qingjian-core.workspace = true
qingjian-format.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
