# 推 v<版本> 標籤發三個平臺（共用一個 GitHub Release）；單平臺補丁推 macos-v / windows-v / linux-v<版本>，只打那一個平臺。
# 版本號讀各平臺殼：macOS apps/macos/Cargo.toml、Windows apps/windows/server/Cargo.toml、Linux apps/linux/server/Cargo.toml，要打的平臺都得與標籤一致。
# 流程：prepare 核對版本、建草稿 Release → 各平臺 job 並行打包，把安裝包與摘要 / 構建資訊片段傳到草稿上
# → publish 合併片段、轉正、生成並簽名 releases.json、觸發官網構建。任何平臺失敗都停在草稿，不會發出缺平臺的版本。
# 流程見 docs/notes/release.md。macOS 的簽名與公證可選，下面的 Secrets 配齊才籤，否則出 ad-hoc 包；
# Windows 現在沒有程式碼簽名（QINGJIAN_UIACCESS=0 關掉 uiAccess，否則沒簽名的 Server 起不來），證書辦下來再加 signtool。
#   QINGJIAN_CERT_P12            Developer ID Application + Installer 兩張證書（含私鑰）匯出的 .p12，base64
#   QINGJIAN_CERT_PASSWORD       .p12 的密碼
#   QINGJIAN_SIGN_IDENTITY       "Developer ID Application: 名字 (TEAMID)"
#   QINGJIAN_INSTALLER_IDENTITY  "Developer ID Installer: 名字 (TEAMID)"
#   QINGJIAN_NOTARY_KEY          App Store Connect API 金鑰 .p8，base64
#   QINGJIAN_NOTARY_KEY_ID       金鑰的 Key ID
#   QINGJIAN_NOTARY_ISSUER       金鑰的 Issuer ID
# 版本索引的簽名（必須，沒配門禁直接失敗）：
#   QINGJIAN_INDEX_SIGNING_KEY   releases.json 的 ed25519 私鑰（base64 的 32 位元組，tools/release-sign keygen 生成），
#                                公鑰在 crates/qingjian-update/src/index/signature.rs；軟體內檢查更新只認簽過名的索引
# 發版後讓官網重新構建（也可選）：
#   QINGJIAN_WEB_TOKEN           fine-grained PAT，對 qingjian-team/qingjian-web 有 Contents: read and write
#                                （官網由 Cloudflare 按倉庫提交自動構建，tools/release/bump-website.sh 往那邊推一個小提交）
#
# 門禁：版本號與標籤一致且不帶 -dev；標籤指向的提交必須在 main 上（防止從沒合併的分支或手滑的本地提交發版）。
# Secrets 不放 workflow 頂層 env，只注入真正用它的那一步；有沒有配由第一步算成輸出（secrets 不能直接寫在 if 裡）。
# actions 釘到 commit（註釋是對應標籤），Dependabot 每週更新；產品資料與本地整句模型按 tools/release/data.lock 釘住的 data-vN Release 下載、按鎖檔案裡的雜湊校驗，標籤與雜湊記進 build-info.json。
name: release

on:
  push:
    tags: ['v*', 'macos-v*', 'windows-v*', 'linux-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.gate.outputs.version }}
      macos: ${{ steps.gate.outputs.macos }}
      windows: ${{ steps.gate.outputs.windows }}
      linux: ${{ steps.gate.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions match tag and tag is on main
        id: gate
        env:
          INDEX_KEY_SET: ${{ secrets.QINGJIAN_INDEX_SIGNING_KEY != '' }}
        run: |
          if [[ "$INDEX_KEY_SET" != "true" ]]; then
            echo "沒配 QINGJIAN_INDEX_SIGNING_KEY：releases.json 籤不了名，已裝的青簡都不認這份索引、收不到更新提示（docs/notes/release.md）" >&2
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*) PLATFORMS="macos windows linux"; VERSION="${GITHUB_REF_NAME#v}" ;;
            *-v*) PLATFORMS="${GITHUB_REF_NAME%%-v*}"; VERSION="${GITHUB_REF_NAME#*-v}" ;;
          esac
          declare -A MANIFEST=([macos]=apps/macos/Cargo.toml [windows]=apps/windows/server/Cargo.toml [linux]=apps/linux/server/Cargo.toml)
          for platform in $PLATFORMS; do
            found="$(sed -n 's/^version = "\(.*\)"/\1/p' "${MANIFEST[$platform]}" | head -1)"
            if [[ "$found" != "$VERSION" ]]; then
              echo "${MANIFEST[$platform]} 是 $found，標籤是 $GITHUB_REF_NAME，先改版本號再打標籤" >&2
              exit 1
            fi
          done
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 還是開發版號，發版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "標籤 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合併再發" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          for platform in macos windows linux; do
            [[ " $PLATFORMS " == *" $platform "* ]] && on=true || on=false
            echo "$platform=$on" >> "$GITHUB_OUTPUT"
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
          MACOS: ${{ steps.gate.outputs.macos }}
          WINDOWS: ${{ steps.gate.outputs.windows }}
          LINUX: ${{ steps.gate.outputs.linux }}
          MAC_SIGNED: ${{ secrets.QINGJIAN_CERT_P12 != '' }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          python3 tools/release/releases_json.py --notes-for "$VERSION" > "$NOTES"
          if [[ "$MACOS" == "true" && "$MAC_SIGNED" != "true" ]]; then
            printf '\n> macOS：這一版沒有 Apple 開發者簽名，首次開啟系統會攔一下：到「系統設定 → 隱私與安全性」底部點「仍要開啟」再裝一次。\n' >> "$NOTES"
          fi
          if [[ "$WINDOWS" == "true" ]]; then
            printf '\n> Windows：這一版沒有程式碼簽名：安裝時 SmartScreen 攔截請點「更多資訊 → 仍要執行」；工作列搜尋、「設定」等系統應用裡候選視窗可能被遮擋。\n' >> "$NOTES"
          fi
          if [[ "$LINUX" == "true" ]]; then
            printf '\n> Linux：預編譯包在 Ubuntu 26.04 上構建，其他發行版請用原始碼安裝；解開後執行 install.sh，說明見官網文件「Linux」。\n' >> "$NOTES"
          fi
          case "$GITHUB_REF_NAME" in
            macos-v*) TITLE="青簡 macOS $VERSION" ;;
            windows-v*) TITLE="青簡 Windows $VERSION" ;;
            linux-v*) TITLE="青簡 Linux $VERSION" ;;
            *) TITLE="青簡 $VERSION" ;;
          esac
          # 帶預釋出字尾的版本（0.1.4-beta.1）是測試渠道的：標成預釋出，不搶 GitHub 的 latest
          PRERELEASE=(); [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease --latest=false)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$TITLE" --notes-file "$NOTES" ${PRERELEASE[@]+"${PRERELEASE[@]}"}

  macos:
    needs: prepare
    if: needs.prepare.outputs.macos == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bundle.sh 用提交數當構建號
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: |
          echo "sign=${{ secrets.QINGJIAN_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"
          echo "notarize=${{ secrets.QINGJIAN_NOTARY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      - name: Import signing certificates
        if: steps.secrets.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.QINGJIAN_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.QINGJIAN_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.QINGJIAN_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.QINGJIAN_INSTALLER_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          {
            echo "QINGJIAN_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "QINGJIAN_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY: ${{ secrets.QINGJIAN_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.QINGJIAN_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.QINGJIAN_NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials qingjian --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "QINGJIAN_NOTARY_PROFILE=qingjian" >> "$GITHUB_ENV"

      - name: Build pkg (arm64)
        run: QINGJIAN_TARGET=aarch64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Build pkg (x86_64)
        run: QINGJIAN_TARGET=x86_64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload-build.sh macos "macOS $(sw_vers -productVersion)" target/pkg/*.pkg

  windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # 沒有程式碼簽名證書：Server 不帶 uiAccess（沒簽名的 exe 帶 uiAccess=true 起不來；build.rs 預設也不帶，build.ps1 還會按 -Sign 重設）。證書辦下來後在 build.ps1 加 signtool、走 -Sign。
      QINGJIAN_UIACCESS: '0'
      PYTHON: python
      # Windows 上 Python 的標準輸出預設 cp1252，中文更新日誌會編碼失敗。
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          # 安裝包另帶一份 32 位 TSF DLL（build.ps1 編）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      # 與開發機同版本（7.1.0，自帶簡體中文翻譯；Chocolatey 只有 6.x，6 的安裝包不帶簡中）。釘死 GitHub Release 上的檔案。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下載來的安裝程式要以管理員身份執行，先核對 SHA-256（2026-09-11 從上面地址下載後算出），對不上就不裝。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安裝程式 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload-build.sh windows "$(powershell -NoProfile -Command '(Get-CimInstance Win32_OperatingSystem).Caption' | tr -d '\r')" target/installer/*.exe

  linux:
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    # Fcitx5 外掛連結的是構建機上的 Fcitx5，與已驗證的 Ubuntu 26.04 一致
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Fcitx5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libssl-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev nlohmann-json3-dev fcitx5

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      - name: Build package
        run: apps/linux/scripts/package.sh

      # 裝進臨時目錄再解除安裝：包裡檔案齊、校驗過得去、兩個二進位制在這臺機器上找得到全部動態庫
      - name: Smoke-test package
        run: |
          work="$RUNNER_TEMP/package-test"
          mkdir -p "$work"
          tar -xzf target/linux-package/*.tar.gz -C "$work"
          cd "$work"/qingjian-*/
          export XDG_DATA_HOME="$work/data"
          ./install.sh --prefix "$work/prefix"
          for binary in "$work/prefix/bin/qingjian-linux-server" "$work/prefix/lib/fcitx5/qingjian.so"; do
            if ldd "$binary" | grep 'not found'; then exit 1; fi
          done
          ./uninstall.sh --prefix "$work/prefix"
          test ! -e "$work/prefix/bin/qingjian-linux-server"

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/upload-build.sh linux "$(. /etc/os-release && echo "$PRETTY_NAME"), Fcitx5 $(pkg-config --modversion Fcitx5Core)" target/linux-package/*.tar.gz

  publish:
    needs: [prepare, macos, windows, linux]
    # 沒選中的平臺是 skipped，照樣發；有平臺失敗就停在草稿
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: echo "website=${{ secrets.QINGJIAN_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Merge checksums and build info, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: tools/release/finish-release.sh "$GITHUB_REF_NAME" "$VERSION" "$RUNNER_TEMP/release"

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
          QINGJIAN_INDEX_SIGNING_KEY: ${{ secrets.QINGJIAN_INDEX_SIGNING_KEY }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh
