name: 使用疑問
description: 不確定是用法問題還是缺陷，先問一下
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        標題請用一句話寫清要問什麼，例如「雙拼下怎麼輸入 ü」。

        按鍵總表、雙拼、雲聯想等用法在 [使用說明](https://qingjian.app/docs) 裡，很多問題能直接查到。
  - type: checkboxes
    id: checked
    attributes:
      label: 提交前確認
      options:
        - label: 已搜尋過現有 issue（包括已關閉的），沒有重複
          required: true
        - label: 已查過[使用說明](https://qingjian.app/docs)，裡面沒有答案
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平臺
      options:
        - macOS
        - Windows
        - 與平臺無關
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 問題
      description: 想做什麼、試了什麼、結果如何。
    validations:
      required: true
