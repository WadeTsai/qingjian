name: 功能建議
description: 希望新增的能力，或現有功能的改進
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        標題請用一句話寫清想要什麼，例如「候選視窗支援自定義字型」。

        提建議前可以先搜一下已有 issue，已經有人提過的話在那條下面點個 👍 或補充場景即可，不必重開。
  - type: checkboxes
    id: checked
    attributes:
      label: 提交前確認
      options:
        - label: 已搜尋過現有 issue（包括已關閉的），沒有重複
          required: true
        - label: 已查過[使用說明](https://qingjian.app/docs)，裡面沒有答案
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平臺
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - 全部平臺
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解決什麼問題
      description: 先說場景和困擾，而不是直接說方案。例如「寫程式碼時經常想不起變數名的英文」。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你設想的互動方式，包括按鍵、設定項、候選的顯示方式等。
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 其他輸入法的參考
      description: 如果別的輸入法（搜狗、微信、Rime、微軟拼音等）已有類似功能，說一下它們怎麼做的，有截圖更好。
  - type: textarea
    id: extra
    attributes:
      label: 補充
