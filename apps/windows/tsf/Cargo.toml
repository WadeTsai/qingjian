[package]
name = "qingjian-windows-tsf"
description = "Windows 輸入法的 TSF 文本服務 DLL：載入進每個應用程序，把系統按鍵經 IPC 交給 Server 程序（../server）"
version = "0.2.1-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

# cdylib 是產物 qingjian_tsf.dll（regsvr32 與安裝指令碼都認這個名字）；rlib 給端到端協議測試 `use qingjian_tsf`。
[lib]
name = "qingjian_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
qingjian-core.workspace = true
qingjian-platform.workspace = true
thiserror.workspace = true

[dev-dependencies]
qingjian-windows-server = { path = "../server" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-registry.workspace = true
# `#[implement]` 巨集展開引用 `::windows_core`，要直接依賴
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
