# Windows 靜態連結 CRT：Rust 預設動態鏈 vcruntime140.dll，它不隨 Windows 自帶，
# 且 AppContainer 程序（工作列搜尋等）能否讀到 System32 裡那份取決於別的安裝程式留下的 ACL，
# 讀不到時 TSF DLL 整個載入失敗、系統切回上一個輸入法。靜態連結後只依賴系統自帶的 DLL。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
