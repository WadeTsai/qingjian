[package]
name = "qingjian-render"
description = "自繪渲染器：把候選窗一幀畫成點陣圖，各平臺只負責貼圖"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tiny-skia.workspace = true
# 主題裡的 SVG 圖片：解析 + 柵格到 tiny-skia 點陣圖（與上面同一個 tiny-skia）；不要 SVG 文字、系統字型與內嵌點陣圖解碼
resvg = { version = "0.48.1", default-features = false }
cosmic-text.workspace = true
zeno.workspace = true
thiserror.workspace = true
tracing.workspace = true
taffy.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# 字型登記走 DirectWrite（按字族名找檔案、列字族）
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"] }

[dev-dependencies]
clap.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
